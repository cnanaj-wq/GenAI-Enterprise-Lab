name: Module 1 CI

on:
  push:
    branches: [main, module-1-agentic-ai]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: genai_lab
          POSTGRES_USER: genai
          POSTGRES_PASSWORD: genai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U genai -d genai_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: genai_lab
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai
      POSTGRES_PORT: 5432
      POSTGRES_HOST: 127.0.0.1
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Apply migrations
        env:
          PGPASSWORD: genai
        run: |
          for migration in database/migrations/*.sql; do
            psql -h 127.0.0.1 -U genai -d genai_lab -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Ruff
        run: python -m ruff check apps/api apps/mcp data/generators scripts tests

      - name: Pytest
        run: python -m pytest -q

  frontend-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Next.js production build
        run: npm run build
